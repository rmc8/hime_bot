[project]
name = "hime-bot"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "rmc8", email = "k@rmc-8.com" }]
dependencies = [
    "discord-py>=2.4.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.18",
    "langchain-community>=0.3.17",
    "pydantic>=2.10.6",
    "langchain-groq>=0.2.4",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hime_bot"]

[tool.rye.scripts]
start = "python bot"
